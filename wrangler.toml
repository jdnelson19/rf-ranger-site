# Cloudflare Worker: serves public/ as static files; src/worker.js answers /api/*.
name = "rf-ranger-site"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
# Paths with no matching file (the /api routes) go to the Worker.
not_found_handling = "none"

# Email sign-ups for release news (src/subscribe.js). Wrangler creates the
# namespace on the first deploy; no ID needs to be filled in.
[[kv_namespaces]]
binding = "SUBSCRIBERS"

# Device reports attached to feedback (src/feedback.js), kept private. Created on first deploy.
[[kv_namespaces]]
binding = "REPORTS"
