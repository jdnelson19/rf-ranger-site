name: Deploy

# Deploys rfranger.app (the rf-ranger-site Cloudflare Worker) on every push to
# main, and from the Actions tab (Run workflow). Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   an API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account ID (in any dash.cloudflare.com/<id>/… address)
# Worker secrets set in Cloudflare (GITHUB_TOKEN) are kept by each deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check the secrets are set
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets (Settings → Secrets and variables → Actions):$missing"
            exit 1
          fi

      # Wrangler's own output, surfaced as an annotation when it fails, so the
      # reason shows on the run page without opening the log.
      - name: Deploy
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4 deploy 2>&1 | tee deploy.log; then
            tail -n 25 deploy.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}' > tail.txt
            echo "::error title=wrangler deploy failed::$(cat tail.txt)"
            exit 1
          fi

      - name: Check the live site
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://rfranger.app/)
            [ "$code" = 200 ] && { echo "rfranger.app answers 200"; exit 0; }
            sleep 5
          done
          echo "::warning::rfranger.app did not answer 200 after the deploy (last: $code)"
